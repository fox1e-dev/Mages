# Inspired by github.com/Arsolitt/tuwunel-helm

name: Feature request / Enhancement
description: Suggest a UI/UX improvement, something that could use an improvement in Mages
labels: ["enhancement"]
title: "[Feat] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What is missing
      description: What are you missing? What could be improved?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this solved/implemented?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Anything else?
      description: |
        Links? References? Anything that will give us more context about the issue you are encountering!

        Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
    validations:
      required: false