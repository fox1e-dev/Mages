# Inspired by github.com/Arsolitt/tuwunel-helm

name: Bug report
description: Something in Mages doesn't work correctly
labels: ["bug"]
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happens
      description: What did you expect, and what happened instead?
      placeholder: The spaces view doesn't render...
    validations:
      required: true

  - type: input
    id: mages-version
    attributes:
      label: Mages version
      placeholder: 4.11.9
    validations:
      required: false

  - type: input
    id: platform
    attributes:
      label: Platform on which the bug occured
      placeholder: Android
    validations:
      required: false

  - type: textarea
    attributes:
      label: Anything else?
      description: |
        Links? References? Anything that will give us more context about the issue you are encountering!

        Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
    validations:
      required: false
